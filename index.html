    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --fuchsia: #C0005A;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes spin3d {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }

      @keyframes terminalGlitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }

      .scanline {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100px;
        background: linear-gradient(to bottom, transparent, rgba(192, 0, 90, 0.1), transparent);
        opacity: 0.5;
        pointer-events: none;
        z-index: 999;
        animation: scanline 4s linear infinite;
      }

      .terminal-flicker {
        animation: terminalGlitch 0.2s infinite;
        text-shadow: 2px 0 rgba(192, 0, 90, 0.5), -2px 0 rgba(0, 255, 255, 0.2);
      }

      .perspective-1000 {
        perspective: 1000px;
      }

      .preserve-3d {
        transform-style: preserve-3d;
      }

      .ghost-spin-active {
        animation: spin3d 12s linear infinite;
      }

      .stitch-corner {
        position: relative;
      }
      .stitch-corner::before, .stitch-corner::after {
        content: '×';
        position: absolute;
        font-family: 'Courier New', monospace;
        font-weight: bold;
        color: white;
        font-size: 18px;
        line-height: 1;
        pointer-events: none;
        z-index: 20;
      }
      .stitch-corner::before { top: 4px; left: 4px; }
      .stitch-corner::after { bottom: 4px; right: 4px; }

      .stitch-line-h {
        background-image: linear-gradient(to right, #333 40%, rgba(255,255,255,0) 0%);
        background-position: center;
        background-size: 8px 1px;
        background-repeat: repeat-x;
        height: 1px;
      }

      .stitch-line-v {
        background-image: linear-gradient(to bottom, #333 40%, rgba(255,255,255,0) 0%);
        background-position: center;
        background-size: 1px 8px;
        background-repeat: repeat-y;
        width: 1px;
      }

      .hover-stitch:hover .stitch-line-h, .hover-stitch:hover .stitch-line-v {
        background-image: linear-gradient(to right, var(--fuchsia) 40%, rgba(255,255,255,0) 0%);
      }

      .bg-fuchsia-studio {
        background-color: var(--fuchsia);
      }
      
      .text-fuchsia-studio {
        color: var(--fuchsia);
      }

      .logo-font {
        font-family: 'Bebas Neue', sans-serif;
      }

      .wound-stitch {
        display: inline-flex;
        gap: 2px;
        font-family: monospace;
        font-weight: 900;
        color: var(--fuchsia);
      }

      ::-webkit-scrollbar {
        width: 3px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--fuchsia);
      }

      .graffiti-bg {
        background-image: radial-gradient(circle at 1px 1px, rgba(192, 0, 90, 0.05) 1px, transparent 0);
        background-size: 32px 32px;
      }

      .logo-glow {
        filter: drop-shadow(0 0 10px rgba(192, 0, 90, 0.3));
      }

      .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        z-index: 1000;
      }
    </style>
  </head>
  <body class="graffiti-bg">
    <div class="crt-overlay"></div>
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
